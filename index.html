<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abel Ibarra Chef</title>
<style>
:root { --primary:#ff0050; --secondary:#00f2ea; --bg:#0f0f0f; --card:#1a1a1a; --text:#fff; --border:#333; }
body { font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); margin:0; padding:16px; max-width:900px; margin:0 auto; line-height:1.5; }
header { text-align:center; padding:24px 16px; background:linear-gradient(135deg,#ff0050,#00f2ea); border-radius:20px; margin-bottom:20px; }
.logo { width:72px; height:72px; border-radius:50%; object-fit:cover; border:3px solid #fff; margin-bottom:8px; }
h1 { margin:0 0 4px; font-size:1.7em; }
.card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; border:1px solid var(--border); }
textarea, button { width:100%; padding:12px; margin:6px 0; border:none; border-radius:10px; font-size:16px; }
textarea { background:#2a2a2a; color:#fff; }
button { background:var(--primary); color:#fff; font-weight:bold; cursor:pointer; }
.filters { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0; }
.filter-btn { padding:7px 12px; background:#333; border-radius:20px; cursor:pointer; border:2px solid transparent; font-size:13px; }
.filter-btn.active { border-color:var(--secondary); }
.recipe { background:#222; border-radius:12px; margin:8px 0; cursor:pointer; overflow:hidden; }
.recipe img { width:100%; height:140px; object-fit:cover; }
.recipe-content { padding:12px; }
.recipe h3 { color:var(--secondary); margin:0 0 4px; font-size:1.05em; }
.badge { display:inline-block; background:#333; padding:2px 7px; border-radius:8px; font-size:.75em; margin-right:4px; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:1000; overflow:auto; }
.modal-content { background:var(--card); margin:12px auto; padding:18px; border-radius:16px; max-width:620px; position:relative; }
.modal img { width:100%; border-radius:12px; margin-bottom:10px; }
.close { position:absolute; top:10px; right:14px; font-size:26px; cursor:pointer; }
.timer { font-size:1.8em; font-weight:bold; color:var(--secondary); text-align:center; margin:10px 0; }
.macros { display:flex; gap:6px; flex-wrap:wrap; }
.macro { background:#222; padding:5px 9px; border-radius:8px; font-size:.85em; }
</style>
</head>
<body>
<header>
  <img src="images/logo.jpg" alt="Abel Ibarra Chef" class="logo">
  <h1>Abel Ibarra Chef</h1>
  <p>Nikkei • Mediterráneo • Recetas fáciles y rápidas</p>
</header>

<div class="card">
  <h2>Generador de recetas</h2>
  <textarea id="ingredients" placeholder="Escribe lo que tienes: salmón, limón, ajo, brócoli, feta, pollo, arroz..." rows="3"></textarea>
  <button onclick="generate()">✨ Generar recetas con mis ingredientes</button>
  <div class="filters">
    <div class="filter-btn active" onclick="setFilter('all',this)">Todas</div>
    <div class="filter-btn" onclick="setFilter('nikkei',this)">Nikkei</div>
    <div class="filter-btn" onclick="setFilter('mediterraneo',this)">Mediterráneo</div>
    <div class="filter-btn" onclick="setFilter('viral',this)">Virales</div>
    <div class="filter-btn" onclick="setFilter('protein',this)">Alto proteína</div>
    <div class="filter-btn" onclick="setFilter('fast',this)"><20 min</div>
  </div>
</div>

<div id="recipes" class="card"></div>

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

  {id:5, name:"Pollo al Limón Mediterráneo", tip:"Jugoso y aromático.", ingredients:["400 g pechuga de pollo","1 limón","3 dientes de ajo","20 ml aceite de oliva","romero"], steps:["Marina el pollo.","Dora en sartén.","Cocina hasta dorado.","Sirve con el jugo."], tags:["mediterraneo","protein","easy","fast"], time:"25 min", protein:"alto", macros:{kcal:380,protein:42,carbs:4,fat:20}},

  {id:7, name:"Pasta de Cottage Cheese Alto Proteína", tip:"Tendencia de alto proteína.", ingredients:["200 g pasta","250 g cottage cheese","2 dientes de ajo","30 g parmesano"], steps:["Cocina la pasta al dente.","Licúa el cottage con ajo y agua de pasta.","Mezcla con la pasta caliente y parmesano."], tags:["protein","easy","fast","viral"], time:"15 min", protein:"alto", macros:{kcal:480,protein:32,carbs:52,fat:14}},
  {id:8, name:"Bowl de Pollo con Arroz y Brócoli", tip:"Perfecto para meal prep.", ingredients:["200 g pechuga de pollo","150 g arroz","150 g brócoli","15 ml salsa de soja","2 dientes de ajo"], steps:["Cocina el arroz.","Saltea el pollo con ajo y soja.","Cocina el brócoli.","Arma el bowl."], tags:["protein","easy","fast"], time:"25 min", protein:"alto", macros:{kcal:450,protein:38,carbs:42,fat:12}},
  {id:9, name:"Poke Bowl Nikkei", tip:"Fresco y completo.", ingredients:["150 g salmón","120 g arroz","1/2 aguacate","pepino","edamame","salsa de soja","sésamo"], steps:["Cocina el arroz.","Corta el pescado y el aguacate.","Arma el bowl.","Aliña con soja y sésamo."], tags:["nikkei","protein","healthy","fast"], time:"20 min", protein:"alto", macros:{kcal:480,protein:30,carbs:42,fat:18}},
  {id:10, name:"Ensalada Griega Clásica", tip:"Fresca y simple.", ingredients:["1 pepino","2 tomates","100 g feta","50 g aceitunas","cebolla morada","aceite de oliva","orégano"], steps:["Corta todas las verduras.","Añade feta y aceitunas.","Aliña con aceite y orégano."], tags:["mediterraneo","easy","fast","healthy"], time:"10 min", protein:"medio", macros:{kcal:280,protein:10,carbs:12,fat:22}},
  {id:11, name:"Lomo Saltado Nikkei", tip:"Clásico peruano con influencia asiática.", ingredients:["300 g lomo de res","1 cebolla","2 tomates","papas fritas","30 ml salsa de soja","vinagre"], steps:["Saltea la carne a fuego alto.","Añade cebolla y tomate.","Incorpora soja y vinagre.","Sirve con papas."], tags:["nikkei","protein"], time:"25 min", protein:"alto", macros:{kcal:520,protein:38,carbs:32,fat:24}},
  {id:12, name:"Hot Honey Feta Chicken", tip:"Dulce-picante viral.", ingredients:["400 g pollo","45 g miel","100 g feta","2 dientes de ajo","chile en polvo","aceite"], steps:["Marina el pollo.","Cocínalo hasta dorar.","Haz la salsa de miel picante.","Sirve con feta."], tags:["viral","protein","mediterraneo"], time:"30 min", protein:"alto", macros:{kcal:490,protein:40,carbs:22,fat:26}},
  {id:13, name:"Huevos con Pesto y Pan Tostado", tip:"Desayuno o cena ultra rápida.", ingredients:["2 huevos","30 g pesto","2 rebanadas de pan","1 tomate"], steps:["Tuesta el pan.","Cocina los huevos.","Unta el pesto y monta con el tomate."], tags:["easy","fast","protein","breakfast"], time:"10 min", protein:"alto", macros:{kcal:380,protein:20,carbs:28,fat:22}},

  {id:16, name:"Bowl de Quinoa y Garbanzos", tip:"Completo y vegetariano.", ingredients:["100 g quinoa","150 g garbanzos","aguacate","espinacas","limón","aceite"], steps:["Cocina la quinoa.","Calienta los garbanzos.","Arma el bowl.","Aliña con limón."], tags:["mediterraneo","protein","healthy","easy"], time:"20 min", protein:"alto", macros:{kcal:450,protein:18,carbs:52,fat:18}},

  {id:18, name:"Tacos de Pescado", tip:"Frescos y ligeros.", ingredients:["300 g pescado blanco","tortillas","col","lima","crema","cilantro"], steps:["Cocina el pescado.","Calienta las tortillas.","Arma con col, pescado, crema y lima."], tags:["easy","fast","protein","nikkei"], time:"20 min", protein:"alto", macros:{kcal:380,protein:28,carbs:32,fat:14}},
  {id:19, name:"Overnight Oats de Chocolate", tip:"Desayuno listo al despertar.", ingredients:["50 g avena","1 cda cacao","leche","yogur","plátano"], steps:["Mezcla avena, cacao, leche y yogur.","Refrigera toda la noche.","Añade toppings por la mañana."], tags:["easy","breakfast","mealprep"], time:"5 min + overnight", protein:"medio", macros:{kcal:370,protein:15,carbs:50,fat:12}},
  {id:20, name:"Salteado de Verduras y Tofu", tip:"Opción vegetariana alta en proteína.", ingredients:["200 g tofu","brócoli","pimiento","soja","ajo","jengibre","arroz"], steps:["Dora el tofu.","Saltea las verduras con ajo y jengibre.","Añade soja.","Sirve con arroz."], tags:["protein","easy","fast","nikkei"], time:"20 min", protein:"alto", macros:{kcal:380,protein:22,carbs:40,fat:14}}
];

let currentFilter = 'all';
let timerSeconds = 0;
let timerInterval = null;

function normalize(str) {
  return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  display();
}

function display(list) {
  const arr = list || recipes.filter(r => currentFilter === 'all' || r.tags.includes(currentFilter));
  document.getElementById('recipes').innerHTML = '<h2>Recetas (' + arr.length + ')</h2>' + arr.map(r => `
    <div class="recipe" onclick="openRecipe(${r.id})">
      ${r.img ? `<img src="${r.img}" alt="${r.name}">` : ''}
      <div class="recipe-content">
        <h3>${r.name}</h3>
        <div>
          <span class="badge">⏱ ${r.time}</span>
          <span class="badge">💪 ${r.protein}</span>
          ${r.tags.includes('nikkei') ? '<span class="badge">Nikkei</span>' : ''}
          ${r.tags.includes('mediterraneo') ? '<span class="badge">Mediterráneo</span>' : ''}
          ${r.tags.includes('viral') ? '<span class="badge">🔥 Viral</span>' : ''}
        </div>
        <p>${r.tip}</p>
      </div>
    </div>
  `).join('');
}

function openRecipe(id) {
  const r = recipes.find(x => x.id === id);
  document.getElementById('modal-body').innerHTML = `
    ${r.img ? `<img src="${r.img}" alt="${r.name}">` : ''}
    <h2>${r.name}</h2>
    <p>⏱ ${r.time} • 💪 ${r.protein}</p>
    <div class="macros">
      <div class="macro">${r.macros.kcal} kcal</div>
      <div class="macro">P: ${r.macros.protein}g</div>
      <div class="macro">C: ${r.macros.carbs}g</div>
      <div class="macro">F: ${r.macros.fat}g</div>
    </div>
    <div class="timer" id="timerDisplay">00:00</div>
    <button onclick="setTimer(10)">10 min</button>
    <button onclick="setTimer(15)">15 min</button>
    <button onclick="startTimer()">▶️ Iniciar</button>
    <button onclick="pauseTimer()">⏸️ Pausar</button>
    <h3>Ingredientes (gramajes exactos)</h3>
    <ul>${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
    <h3>Pasos</h3>
    ${r.steps.map((s,i) => `<div style="margin:8px 0;padding:10px;background:#222;border-radius:8px;"><strong>${i+1}.</strong> ${s}</div>`).join('')}
    <p style="margin-top:10px;"><em>${r.tip}</em></p>
  `;
  document.getElementById('modal').style.display = 'block';
}

function closeModal() {
  pauseTimer();
  document.getElementById('modal').style.display = 'none';
}

function setTimer(m) { timerSeconds = m*60; updateTimer(); }
function startTimer() {
  if (timerInterval) return;
  timerInterval = setInterval(() => {
    if (timerSeconds <= 0) { clearInterval(timerInterval); timerInterval=null; alert('⏰ ¡Listo!'); return; }
    timerSeconds--; updateTimer();
  }, 1000);
}
function pauseTimer() { clearInterval(timerInterval); timerInterval=null; }
function updateTimer() {
  const m = Math.floor(timerSeconds/60), s = timerSeconds%60;
  const el = document.getElementById('timerDisplay');
  if (el) el.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function generate() {
  const q = document.getElementById('ingredients').value.trim();
  if (!q) return alert('Escribe algunos ingredientes primero');
  const words = normalize(q).split(/[, ]+/).filter(w => w.length > 2);
  const matches = recipes.filter(r => {
    const text = normalize(r.name + ' ' + r.ingredients.join(' ') + ' ' + r.tip);
    return words.some(w => text.includes(w));
  });
  if (matches.length === 0) {
    alert('No encontré coincidencias exactas. Te muestro las más populares.');
    display(recipes.slice(0, 6));
  } else {
    display(matches);
  }
}

display();
window.onclick = e => { if (e.target.id === 'modal') closeModal(); };
</script>
</body>
</html>
