<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abel Ibarra Chef</title>
<style>
:root { --primary:#ff0050; --secondary:#00f2ea; --bg:#0f0f0f; --card:#1a1a1a; --text:#fff; --border:#333; }
body { font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); margin:0; padding:16px; max-width:900px; margin:0 auto; line-height:1.5; }
header { text-align:center; padding:24px 16px; background:linear-gradient(135deg,#ff0050,#00f2ea); border-radius:20px; margin-bottom:20px; }
.logo { width:72px; height:72px; border-radius:50%; object-fit:cover; border:3px solid #fff; margin-bottom:8px; }
h1 { margin:0 0 4px; font-size:1.7em; }
.card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; border:1px solid var(--border); }
input, textarea, button, select { width:100%; padding:12px; margin:6px 0; border:none; border-radius:10px; font-size:16px; box-sizing:border-box; }
input, textarea, select { background:#2a2a2a; color:#fff; }
button { background:var(--primary); color:#fff; font-weight:bold; cursor:pointer; }
.filters { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0; }
.filter-btn { padding:7px 12px; background:#333; border-radius:20px; cursor:pointer; border:2px solid transparent; font-size:13px; }
.filter-btn.active { border-color:var(--secondary); }
.recipe { background:#222; border-radius:12px; margin:8px 0; cursor:pointer; padding:12px; }
.recipe h3 { color:var(--secondary); margin:0 0 4px; font-size:1.05em; }
.badge { display:inline-block; background:#333; padding:2px 7px; border-radius:8px; font-size:.75em; margin-right:4px; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:1000; overflow:auto; }
.modal-content { background:var(--card); margin:12px auto; padding:18px; border-radius:16px; max-width:620px; position:relative; }
.close { position:absolute; top:10px; right:14px; font-size:26px; cursor:pointer; }
.timer { font-size:1.8em; font-weight:bold; color:var(--secondary); text-align:center; margin:10px 0; }
.macros { display:flex; gap:6px; flex-wrap:wrap; }
.macro { background:#222; padding:5px 9px; border-radius:8px; font-size:.85em; }
.servings { display:flex; gap:8px; align-items:center; margin:8px 0; }
.servings button { width:40px; }
.shopping { background:#222; border-radius:10px; padding:10px; margin:6px 0; }
</style>
</head>
<body>
<header>
  <img src="images/logo.jpg" alt="Abel Ibarra Chef" class="logo">
  <h1>Abel Ibarra Chef</h1>
  <p>Cocina fácil • Lista de compra • Porciones ajustables</p>
</header>

<div class="card">
  <h2>Generador + Lista de compra</h2>
  <textarea id="ingredients" placeholder="Escribe lo que tienes: salmón, limón, ajo, calabaza..." rows="2"></textarea>
  <button onclick="generate()">✨ Generar recetas</button>
  <div class="filters">
    <div class="filter-btn active" onclick="setFilter('all',this)">Todas</div>
    <div class="filter-btn" onclick="setFilter('nikkei',this)">Nikkei</div>
    <div class="filter-btn" onclick="setFilter('otono',this)">Otoño</div>
    <div class="filter-btn" onclick="setFilter('mediterraneo',this)">Mediterráneo</div>
    <div class="filter-btn" onclick="setFilter('fast',this)"><25 min</div>
  </div>
</div>

<div id="recipes" class="card"></div>

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const recipes = [
  {id:1, name:"Tiradito Nikkei de Salmón", tip:"Fresco, cítrico y elegante.", ingredients:["200 g salmón fresco","30 ml jugo de limón","15 ml salsa de soja","10 g jengibre","cilantro"], steps:["Corta el salmón en láminas.","Mezcla limón, soja y jengibre.","Baña el salmón.","Deja reposar 5 minutos.","Sirve con cilantro."], tags:["nikkei","fast","protein"], time:"10 min", protein:"alto", macros:{kcal:280,protein:28,carbs:4,fat:16}, baseServings:2},
  {id:2, name:"Crema de Calabaza de Otoño", tip:"Reconfortante y fácil.", ingredients:["500 g calabaza","1 cebolla","2 dientes de ajo","caldo de verduras","nuez moscada"], steps:["Saltea cebolla y ajo.","Añade calabaza y caldo.","Cocina 20 min.","Licúa y sazona."], tags:["otono","easy"], time:"30 min", protein:"bajo", macros:{kcal:180,protein:4,carbs:22,fat:8}, baseServings:4},
  {id:3, name:"Pasta de Feta al Horno (Viral)", tip:"La receta de TikTok.", ingredients:["200 g pasta","200 g queso feta","250 g tomates cherry","3 dientes de ajo","30 ml aceite de oliva","albahaca"], steps:["Precalienta el horno a 200 °C.","Hornea feta y tomates 25 min.","Mezcla con la pasta y albahaca."], tags:["mediterraneo","viral","easy"], time:"35 min", protein:"medio", macros:{kcal:520,protein:18,carbs:55,fat:26}, baseServings:2},
  {id:4, name:"Arroz Chaufa Nikkei", tip:"Fusión peruano-china-japonesa.", ingredients:["200 g arroz cocido","150 g pollo","2 huevos","30 ml salsa de soja","ajo","jengibre","cebollín"], steps:["Saltea ajo y jengibre.","Añade el pollo.","Incorpora arroz y soja.","Agrega huevos y cebollín."], tags:["nikkei","protein","fast"], time:"20 min", protein:"alto", macros:{kcal:480,protein:30,carbs:52,fat:14}, baseServings:2},
  {id:5, name:"Ensalada Mediterránea de Quinoa", tip:"Fresca y completa.", ingredients:["100 g quinoa","150 g garbanzos","1 pepino","100 g tomates cherry","50 g feta","limón","aceite"], steps:["Cocina la quinoa.","Mezcla con verduras y garbanzos.","Añade feta y aliña."], tags:["mediterraneo","protein","healthy"], time:"20 min", protein:"alto", macros:{kcal:420,protein:18,carbs:48,fat:16}, baseServings:2}
];

let currentFilter = 'all';
let currentServings = {};
let shoppingList = JSON.parse(localStorage.getItem('shopping') || '[]');

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  display();
}

function display(list) {
  const arr = list || recipes.filter(r => currentFilter === 'all' || r.tags.includes(currentFilter));
  document.getElementById('recipes').innerHTML = '<h2>Recetas (' + arr.length + ')</h2>' + arr.map(r => `
    <div class="recipe" onclick="openRecipe(${r.id})">
      <h3>${r.name}</h3>
      <span class="badge">${r.time}</span>
      <span class="badge">${r.protein}</span>
      ${r.tags.includes('nikkei') ? '<span class="badge">Nikkei</span>' : ''}
      ${r.tags.includes('otono') ? '<span class="badge">Otoño</span>' : ''}
      <p>${r.tip}</p>
    </div>`).join('');
}

function openRecipe(id) {
  const r = recipes.find(x => x.id === id);
  if (!currentServings[id]) currentServings[id] = r.baseServings;
  const mult = currentServings[id] / r.baseServings;
  document.getElementById('modal-body').innerHTML = `
    <h2>${r.name}</h2>
    <div class="macros">
      <div class="macro">${Math.round(r.macros.kcal * mult)} kcal</div>
      <div class="macro">P: ${Math.round(r.macros.protein * mult)}g</div>
      <div class="macro">C: ${Math.round(r.macros.carbs * mult)}g</div>
      <div class="macro">F: ${Math.round(r.macros.fat * mult)}g</div>
    </div>
    <div class="servings">
      <button onclick="changeServings(${id}, -1)">-</button>
      <span id="servings-${id}">${currentServings[id]} porciones</span>
      <button onclick="changeServings(${id}, 1)">+</button>
    </div>
    <div class="timer" id="timerDisplay">00:00</div>
    <button onclick="setTimer(10)">10 min</button>
    <button onclick="setTimer(15)">15 min</button>
    <button onclick="startTimer()">▶️ Iniciar temporizador</button>
    <button onclick="pauseTimer()">⏸️ Pausar</button>
    <h3>Ingredientes (ajustados a ${currentServings[id]} porciones)</h3>
    <ul>${r.ingredients.map(i => {
      const match = i.match(/^([\d.]+)\s*(.*)/);
      if (match) {
        const num = (parseFloat(match[1]) * mult).toFixed(match[1].includes('.') ? 1 : 0);
        return `<li>${num} ${match[2]}</li>`;
      }
      return `<li>${i}</li>`;
    }).join('')}</ul>
    <button onclick="addToShopping(${id})">➕ Añadir ingredientes a la lista de compra</button>
    <h3>Pasos</h3>
    ${r.steps.map((s,i) => `<div style="margin:8px 0;padding:10px;background:#222;border-radius:8px;"><strong>${i+1}.</strong> ${s}</div>`).join('')}
    <p><em>${r.tip}</em></p>
  `;
  document.getElementById('modal').style.display = 'block';
}

function changeServings(id, delta) {
  currentServings[id] = Math.max(1, currentServings[id] + delta);
  openRecipe(id);
}

function addToShopping(id) {
  const r = recipes.find(x => x.id === id);
  const mult = currentServings[id] / r.baseServings;
  r.ingredients.forEach(i => {
    const match = i.match(/^([\d.]+)\s*(.*)/);
    let item = i;
    if (match) {
      const num = (parseFloat(match[1]) * mult).toFixed(match[1].includes('.') ? 1 : 0);
      item = `${num} ${match[2]}`;
    }
    if (!shoppingList.includes(item)) shoppingList.push(item);
  });
  localStorage.setItem('shopping', JSON.stringify(shoppingList));
  alert('Ingredientes añadidos a la lista de compra');
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }

let timerSeconds = 0, timerInterval = null;
function setTimer(m) { timerSeconds = m*60; updateTimer(); }
function startTimer() {
  if (timerInterval) return;
  timerInterval = setInterval(() => {
    if (timerSeconds <= 0) { clearInterval(timerInterval); timerInterval=null; alert('⏰ ¡Listo!'); return; }
    timerSeconds--; updateTimer();
  }, 1000);
}
function pauseTimer() { clearInterval(timerInterval); timerInterval=null; }
function updateTimer() {
  const m = Math.floor(timerSeconds/60), s = timerSeconds%60;
  const el = document.getElementById('timerDisplay');
  if (el) el.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function generate() {
  const q = document.getElementById('ingredients').value.trim().toLowerCase();
  if (!q) return alert('Escribe algunos ingredientes');
  const words = q.split(/[, ]+/).filter(w => w.length > 2);
  const matches = recipes.filter(r => words.some(w => (r.name + ' ' + r.ingredients.join(' ')).toLowerCase().includes(w)));
  display(matches.length ? matches : recipes);
}

display();
window.onclick = e => { if (e.target.id === 'modal') closeModal(); };
</script>
</body>
</html>
