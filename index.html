<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abel Ibarra Chef</title>
<style>
:root { --primary:#ff0050; --secondary:#00f2ea; --bg:#0f0f0f; --card:#1a1a1a; --text:#fff; --border:#333; }
body { font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); margin:0; padding:16px; max-width:900px; margin:0 auto; line-height:1.5; }
header { text-align:center; padding:24px 16px; background:linear-gradient(135deg,#ff0050,#00f2ea); border-radius:20px; margin-bottom:20px; }
.logo { width:72px; height:72px; border-radius:50%; object-fit:cover; border:3px solid #fff; margin-bottom:8px; }
h1 { margin:0 0 4px; font-size:1.7em; }
.card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; border:1px solid var(--border); }
input, textarea, button { width:100%; padding:12px; margin:6px 0; border:none; border-radius:10px; font-size:16px; box-sizing:border-box; }
input, textarea { background:#2a2a2a; color:#fff; }
button { background:var(--primary); color:#fff; font-weight:bold; cursor:pointer; }
.filters { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0; }
.filter-btn { padding:7px 12px; background:#333; border-radius:20px; cursor:pointer; border:2px solid transparent; font-size:13px; }
.filter-btn.active { border-color:var(--secondary); }
.recipe { background:#222; border-radius:12px; margin:8px 0; cursor:pointer; padding:12px; }
.recipe h3 { color:var(--secondary); margin:0 0 4px; font-size:1.05em; }
.badge { display:inline-block; background:#333; padding:2px 7px; border-radius:8px; font-size:.75em; margin-right:4px; }
.price-result { background:#222; border-radius:12px; padding:14px; margin:10px 0; }
.price-result strong { color:var(--secondary); }
.super { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #333; }
.best { color:#00f2ea; font-weight:bold; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:1000; overflow:auto; }
.modal-content { background:var(--card); margin:12px auto; padding:18px; border-radius:16px; max-width:620px; position:relative; }
.close { position:absolute; top:10px; right:14px; font-size:26px; cursor:pointer; }
.timer { font-size:1.8em; font-weight:bold; color:var(--secondary); text-align:center; margin:10px 0; }
.macros { display:flex; gap:6px; flex-wrap:wrap; }
.macro { background:#222; padding:5px 9px; border-radius:8px; font-size:.85em; }
</style>
</head>
<body>
<header>
  <img src="images/logo.jpg" alt="Abel Ibarra Chef" class="logo">
  <h1>Abel Ibarra Chef</h1>
  <p>Recetas + Buscador de Precios Inteligente</p>
</header>

<div class="card">
  <h2>🛒 Buscador de Precios</h2>
  <input type="text" id="productSearch" placeholder="Busca un producto: salmón, limón, calabaza, arroz, pollo...">
  <button onclick="searchPrice()">Buscar mejor precio</button>
  <div id="priceResult"></div>
</div>

<div class="card">
  <h2>Generador de recetas</h2>
  <textarea id="ingredients" placeholder="Escribe lo que tienes en casa..." rows="2"></textarea>
  <button onclick="generate()">✨ Generar recetas</button>
  <div class="filters">
    <div class="filter-btn active" onclick="setFilter('all',this)">Todas</div>
    <div class="filter-btn" onclick="setFilter('nikkei',this)">Nikkei</div>
    <div class="filter-btn" onclick="setFilter('otono',this)">Otoño</div>
    <div class="filter-btn" onclick="setFilter('mediterraneo',this)">Mediterráneo</div>
  </div>
</div>

<div id="recipes" class="card"></div>

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const priceDB = {
  "salmón": {unit:"kg", prices:[{super:"Lidl", price:12.99},{super:"Mercadona", price:13.50},{super:"Carrefour", price:14.20},{super:"DIA", price:13.80}]},
  "pollo": {unit:"kg", prices:[{super:"Lidl", price:5.99},{super:"Mercadona", price:6.20},{super:"Carrefour", price:6.50},{super:"DIA", price:6.10}]},
  "arroz": {unit:"kg", prices:[{super:"Lidl", price:0.95},{super:"Mercadona", price:1.05},{super:"Carrefour", price:1.15},{super:"DIA", price:0.99}]},
  "calabaza": {unit:"kg", prices:[{super:"Lidl", price:1.49},{super:"Mercadona", price:1.69},{super:"Carrefour", price:1.89},{super:"DIA", price:1.59}]},
  "setas": {unit:"kg", prices:[{super:"Lidl", price:4.99},{super:"Mercadona", price:5.50},{super:"Carrefour", price:5.99},{super:"DIA", price:5.20}]},
  "limón": {unit:"kg", prices:[{super:"Lidl", price:1.99},{super:"Mercadona", price:2.20},{super:"Carrefour", price:2.49},{super:"DIA", price:2.10}]},
  "ajo": {unit:"kg", prices:[{super:"Lidl", price:3.99},{super:"Mercadona", price:4.20},{super:"Carrefour", price:4.50},{super:"DIA", price:4.10}]},
  "feta": {unit:"kg", prices:[{super:"Lidl", price:8.99},{super:"Mercadona", price:9.50},{super:"Carrefour", price:10.20},{super:"DIA", price:9.30}]},
  "quinoa": {unit:"kg", prices:[{super:"Lidl", price:4.49},{super:"Mercadona", price:4.80},{super:"Carrefour", price:5.20},{super:"DIA", price:4.60}]},
  "atún": {unit:"kg", prices:[{super:"Lidl", price:14.99},{super:"Mercadona", price:15.50},{super:"Carrefour", price:16.20},{super:"DIA", price:15.30}]}
};

function searchPrice() {
  const q = document.getElementById('productSearch').value.trim().toLowerCase();
  if (!q) return;
  const key = Object.keys(priceDB).find(k => q.includes(k) || k.includes(q));
  const el = document.getElementById('priceResult');
  if (!key) {
    el.innerHTML = `<div class="price-result">No tengo datos exactos para "<strong>${q}</strong>". Prueba con: salmón, pollo, arroz, calabaza, setas, limón, ajo, feta, quinoa o atún.</div>`;
    return;
  }
  const data = priceDB[key];
  const sorted = [...data.prices].sort((a,b) => a.price - b.price);
  const best = sorted[0];
  el.innerHTML = `
    <div class="price-result">
      <h3>Precios estimados de <strong>${key}</strong> (€/${data.unit})</h3>
      ${sorted.map(p => `<div class="super ${p === best ? 'best' : ''}"><span>${p.super}</span><span>${p.price.toFixed(2)} €</span></div>`).join('')}
      <p style="margin-top:10px;">🏆 Mejor precio: <strong>${best.super}</strong> a ${best.price.toFixed(2)} €/${data.unit}</p>
      <small>Precios orientativos basados en promedios de mercado. Comprueba en tienda o en Soysuper para precios actuales.</small>
    </div>`;
}

const recipes = [
  {id:1, name:"Tiradito Nikkei de Salmón", tip:"Fresco y elegante.", ingredients:["200 g salmón","30 ml limón","15 ml soja","jengibre","cilantro"], steps:["Corta el salmón.","Mezcla la salsa.","Baña y sirve."], tags:["nikkei"], time:"10 min", protein:"alto", macros:{kcal:280,protein:28,carbs:4,fat:16}},
  {id:2, name:"Crema de Calabaza", tip:"Reconfortante de otoño.", ingredients:["500 g calabaza","cebolla","ajo","caldo"], steps:["Saltea cebolla y ajo.","Añade calabaza y caldo.","Licúa."], tags:["otono"], time:"30 min", protein:"bajo", macros:{kcal:180,protein:4,carbs:22,fat:8}},
  {id:3, name:"Pasta de Feta al Horno", tip:"Viral y fácil.", ingredients:["200 g pasta","200 g feta","tomates cherry","ajo","aceite"], steps:["Hornea feta y tomates.","Mezcla con pasta."], tags:["mediterraneo"], time:"35 min", protein:"medio", macros:{kcal:520,protein:18,carbs:55,fat:26}}
];

let currentFilter = 'all';
function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  display();
}
function display(list) {
  const arr = list || recipes.filter(r => currentFilter === 'all' || r.tags.includes(currentFilter));
  document.getElementById('recipes').innerHTML = '<h2>Recetas</h2>' + arr.map(r => `
    <div class="recipe" onclick="openRecipe(${r.id})">
      <h3>${r.name}</h3>
      <span class="badge">${r.time}</span>
      <span class="badge">${r.protein}</span>
      <p>${r.tip}</p>
    </div>`).join('');
}
function openRecipe(id) {
  const r = recipes.find(x => x.id === id);
  document.getElementById('modal-body').innerHTML = `
    <h2>${r.name}</h2>
    <div class="macros"><div class="macro">${r.macros.kcal} kcal</div><div class="macro">P: ${r.macros.protein}g</div></div>
    <h3>Ingredientes</h3><ul>${r.ingredients.map(i=>`<li>${i}</li>`).join('')}</ul>
    <h3>Pasos</h3>${r.steps.map((s,i)=>`<div style="margin:6px 0;padding:8px;background:#222;border-radius:8px;"><strong>${i+1}.</strong> ${s}</div>`).join('')}
  `;
  document.getElementById('modal').style.display = 'block';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; }
function generate() {
  const q = document.getElementById('ingredients').value.trim().toLowerCase();
  if (!q) return alert('Escribe ingredientes');
  const matches = recipes.filter(r => r.ingredients.join(' ').toLowerCase().includes(q.split(' ')[0]));
  display(matches.length ? matches : recipes);
}
display();
window.onclick = e => { if (e.target.id === 'modal') closeModal(); };
</script>
</body>
</html>
