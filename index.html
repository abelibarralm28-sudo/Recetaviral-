<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abel Ibarra Chef</title>
<style>
:root { --primary:#ff0050; --secondary:#00f2ea; --bg:#0f0f0f; --card:#1a1a1a; --text:#fff; --muted:#aaa; }
body { font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); margin:0; padding:16px; max-width:900px; margin:0 auto; line-height:1.5; }
header { text-align:center; padding:28px 16px; background:linear-gradient(135deg,#ff0050,#00f2ea); border-radius:18px; margin-bottom:20px; }
h1 { margin:0 0 6px; font-size:1.9em; }
.card { background:var(--card); border-radius:14px; padding:18px; margin-bottom:16px; }
input, textarea, button, select { width:100%; padding:12px; margin:6px 0; border:none; border-radius:10px; font-size:16px; box-sizing:border-box; }
input, textarea, select { background:#2a2a2a; color:#fff; }
button { background:var(--primary); color:#fff; font-weight:bold; cursor:pointer; }
.filters { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
.filter-btn { padding:8px 14px; background:#333; border-radius:20px; cursor:pointer; border:2px solid transparent; font-size:14px; }
.filter-btn.active { border-color:var(--secondary); background:#222; }
.recipe { background:#222; border-radius:12px; padding:14px; margin:10px 0; cursor:pointer; transition:transform .15s; }
.recipe:hover { transform:translateY(-2px); }
.recipe h3 { color:var(--secondary); margin:0 0 6px; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:1000; overflow:auto; }
.modal-content { background:var(--card); margin:16px auto; padding:20px; border-radius:14px; max-width:640px; position:relative; }
.close { position:absolute; top:12px; right:14px; font-size:28px; cursor:pointer; }
.timer { font-size:2.2em; font-weight:bold; color:var(--secondary); text-align:center; margin:12px 0; }
.macros { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
.macro { background:#222; padding:6px 10px; border-radius:8px; font-size:.9em; }
.tips { font-size:.95em; color:#ddd; }
.tips li { margin:6px 0; }
.badge { display:inline-block; background:#333; padding:2px 8px; border-radius:10px; font-size:.8em; margin-right:4px; }
</style>
</head>
<body>
<header>
  <h1>👨‍🍳 Abel Ibarra Chef</h1>
  <p>Recetas Nikkei • Mediterráneas • Virales • Generador con IA</p>
</header>

<div class="card">
  <h2>Generador de recetas con IA</h2>
  <textarea id="ingredients" placeholder="Escribe lo que tienes: salmón, arroz, limón, ajo, brócoli, feta..." rows="3"></textarea>
  <button onclick="generateAI()">✨ Generar recetas con mis ingredientes</button>
  <div class="filters" id="filters">
    <div class="filter-btn active" onclick="setFilter('all',this)">Todas</div>
    <div class="filter-btn" onclick="setFilter('nikkei',this)">Nikkei</div>
    <div class="filter-btn" onclick="setFilter('mediterraneo',this)">Mediterráneo</div>
    <div class="filter-btn" onclick="setFilter('viral',this)">Virales</div>
    <div class="filter-btn" onclick="setFilter('protein',this)">Alto proteína</div>
    <div class="filter-btn" onclick="setFilter('fast',this)"><30 min</div>
  </div>
</div>

<div id="recipes" class="card"></div>

<div class="card">
  <h2>Tips de cocina de Abel Ibarra Chef</h2>
  <ul class="tips" id="tips"></ul>
</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const recipes = [
  {id:1, name:"Pasta de Feta al Horno (Viral)", tip:"La receta que empezó el boom de TikTok.", ingredients:["200 g pasta","200 g queso feta","250 g tomates cherry","3 dientes de ajo (≈15 g)","30 ml aceite de oliva","10 g albahaca fresca"], steps:["Precalienta el horno a 200 °C.","Coloca el feta y los tomates en una bandeja.","Añade el ajo laminado y el aceite.","Hornea 25-30 min hasta que el feta se funda.","Cocina la pasta al dente y mezcla todo con la albahaca."], tags:["viral","mediterraneo","easy"], time:"35 min", protein:"medio", macros:{kcal:520,protein:18,carbs:55,fat:26}, servings:2},
  {id:2, name:"Tiradito Nikkei de Salmón", tip:"Fresco, cítrico y elegante. Clásico de la cocina nikkei.", ingredients:["200 g salmón fresco en láminas","30 ml jugo de limón","15 ml salsa de soja","10 g jengibre rallado","1 cucharadita de aji amarillo o chile","5 g cilantro","sal"], steps:["Corta el salmón en láminas finas.","Mezcla limón, soja, jengibre y aji.","Baña el salmón con la salsa.","Deja reposar 5 minutos.","Sirve con cilantro."], tags:["nikkei","protein","fast","healthy"], time:"10 min", protein:"alto", macros:{kcal:280,protein:28,carbs:4,fat:16}, servings:1},
  {id:3, name:"Ceviche Nikkei de Pescado", tip:"Versión peruano-japonesa con toque de soja y jengibre.", ingredients:["250 g pescado blanco","60 ml jugo de limón","15 ml salsa de soja","10 g jengibre","1 cebolla morada","cilantro","ají"], steps:["Corta el pescado en cubos.","Mezcla con limón, soja y jengibre.","Añade cebolla y cilantro.","Deja reposar 10 minutos.","Sirve frío."], tags:["nikkei","protein","fast"], time:"15 min", protein:"alto", macros:{kcal:220,protein:32,carbs:6,fat:6}, servings:2},
  {id:4, name:"Arroz Chaufa Nikkei", tip:"Fusión peruano-china-japonesa. Muy sabroso y rápido.", ingredients:["200 g arroz cocido","150 g pollo o camarones","2 huevos","30 ml salsa de soja","2 dientes de ajo","5 g jengibre","cebollín"], steps:["Saltea ajo y jengibre.","Añade el pollo o camarones.","Incorpora el arroz y la soja.","Agrega los huevos y el cebollín.","Saltea a fuego alto."], tags:["nikkei","protein","fast"], time:"20 min", protein:"alto", macros:{kcal:480,protein:30,carbs:52,fat:14}, servings:2},
  {id:5, name:"Ensalada Mediterránea de Quinoa", tip:"Fresca, completa y llena de color.", ingredients:["100 g quinoa","150 g garbanzos","1 pepino","100 g tomates cherry","50 g feta","20 g aceitunas","jugo de limón","aceite de oliva"], steps:["Cocina la quinoa.","Mezcla con garbanzos, pepino y tomates.","Añade feta y aceitunas.","Aliña con limón y aceite."], tags:["mediterraneo","protein","healthy","easy"], time:"20 min", protein:"alto", macros:{kcal:420,protein:18,carbs:48,fat:16}, servings:2},
  {id:6, name:"Pollo al Limón Mediterráneo", tip:"Jugoso, aromático y listo en 25 minutos.", ingredients:["400 g pechuga de pollo","1 limón","3 dientes de ajo","20 ml aceite de oliva","romero o orégano","sal y pimienta"], steps:["Marina el pollo con limón, ajo y hierbas.","Dora en sartén con aceite.","Cocina hasta que esté dorado.","Sirve con el jugo de la sartén."], tags:["mediterraneo","protein","easy","fast"], time:"25 min", protein:"alto", macros:{kcal:380,protein:42,carbs:4,fat:20}, servings:2},
  {id:7, name:"Pasta de Cottage Cheese Alto Proteína", tip:"Tendencia de alto proteína fuerte en 2026.", ingredients:["200 g pasta","250 g cottage cheese","2 dientes de ajo","30 g parmesano","pimienta"], steps:["Cocina la pasta al dente.","Licúa el cottage con ajo y un poco de agua de pasta.","Mezcla con la pasta caliente y añade parmesano."], tags:["protein","easy","fast","viral"], time:"15 min", protein:"alto", macros:{kcal:480,protein:32,carbs:52,fat:14}, servings:2},
  {id:8, name:"Bowl de Pollo con Arroz y Brócoli", tip:"Perfecto para meal prep.", ingredients:["200 g pechuga de pollo","150 g arroz","150 g brócoli","15 ml salsa de soja","2 dientes de ajo","5 g sésamo"], steps:["Cocina el arroz.","Saltea el pollo con ajo y soja.","Cocina el brócoli.","Arma el bowl y añade sésamo."], tags:["protein","easy","mealprep"], time:"25 min", protein:"alto", macros:{kcal:450,protein:38,carbs:42,fat:12}, servings:2},
  {id:9, name:"Hot Honey Feta Chicken", tip:"Tendencia viral 2026: dulce-picante.", ingredients:["400 g pollo","45 g miel","100 g feta","2 dientes de ajo","1 cucharadita de chile en polvo","15 ml aceite"], steps:["Marina el pollo.","Cocínalo hasta dorar.","Haz la salsa de miel picante.","Sirve con feta por encima."], tags:["viral","protein","mediterraneo"], time:"30 min", protein:"alto", macros:{kcal:490,protein:40,carbs:22,fat:26}, servings:2},
  {id:10, name:"Lomo Saltado Nikkei", tip:"El clásico peruano con influencia china y japonesa.", ingredients:["300 g lomo de res","1 cebolla","2 tomates","papas fritas","30 ml salsa de soja","vinagre","aji amarillo"], steps:["Saltea la carne a fuego alto.","Añade cebolla y tomate.","Incorpora soja y vinagre.","Sirve con papas fritas."], tags:["nikkei","protein"], time:"25 min", protein:"alto", macros:{kcal:520,protein:38,carbs:32,fat:24}, servings:2},
  {id:11, name:"Ensalada Griega Clásica", tip:"Fresca, simple y llena de sabor mediterráneo.", ingredients:["1 pepino","2 tomates","100 g feta","50 g aceitunas","1 cebolla morada","aceite de oliva","orégano"], steps:["Corta todas las verduras.","Añade feta y aceitunas.","Aliña con aceite y orégano."], tags:["mediterraneo","easy","fast","healthy"], time:"10 min", protein:"medio", macros:{kcal:280,protein:10,carbs:12,fat:22}, servings:2},
  {id:12, name:"Poke Bowl Nikkei", tip:"Fresco, colorido y muy completo.", ingredients:["150 g salmón o atún","120 g arroz","1/2 aguacate","pepino","edamame","salsa de soja","sésamo"], steps:["Cocina el arroz.","Corta el pescado y el aguacate.","Arma el bowl.","Aliña con soja y sésamo."], tags:["nikkei","protein","healthy"], time:"20 min", protein:"alto", macros:{kcal:480,protein:30,carbs:42,fat:18}, servings:1}
];

const tips = [
  "Siempre sala el agua de la pasta como si fuera el mar. El sabor se absorbe mejor.",
  "En cocina nikkei, el jengibre fresco y el limón son tus mejores aliados para equilibrar.",
  "Para que el feta se funda bien al horno, no lo envuelvas: déjalo al descubierto.",
  "El secreto de un buen salteado es el fuego alto y no mover demasiado la comida.",
  "En recetas mediterráneas, usa aceite de oliva virgen extra al final para potenciar el sabor.",
  "Si vas a hacer ceviche o tiradito, el pescado debe estar muy fresco y bien frío.",
  "Para más proteína sin añadir muchas calorías, usa cottage cheese o yogur griego como base de salsas.",
  "Deja reposar la carne 5 minutos después de cocinarla para que los jugos se redistribuyan."
];

let currentFilter = 'all';
let timerSeconds = 0;
let timerInterval = null;

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  display();
}

function display(list) {
  const arr = list || recipes.filter(r => currentFilter === 'all' || r.tags.includes(currentFilter));
  document.getElementById('recipes').innerHTML = '<h2>Recetas</h2>' + arr.map(r => `
    <div class="recipe" onclick="openRecipe(${r.id})">
      <h3>${r.name}</h3>
      <div>
        <span class="badge">⏱ ${r.time}</span>
        <span class="badge">💪 ${r.protein}</span>
        ${r.tags.includes('nikkei') ? '<span class="badge">Nikkei</span>' : ''}
        ${r.tags.includes('mediterraneo') ? '<span class="badge">Mediterráneo</span>' : ''}
        ${r.tags.includes('viral') ? '<span class="badge">🔥 Viral</span>' : ''}
      </div>
      <p>${r.tip}</p>
    </div>
  `).join('');
}

function openRecipe(id) {
  const r = recipes.find(x => x.id === id);
  document.getElementById('modal-body').innerHTML = `
    <h2>${r.name}</h2>
    <p>⏱ ${r.time} • 💪 ${r.protein}</p>
    <div class="macros">
      <div class="macro">${r.macros.kcal} kcal</div>
      <div class="macro">P: ${r.macros.protein}g</div>
      <div class="macro">C: ${r.macros.carbs}g</div>
      <div class="macro">F: ${r.macros.fat}g</div>
    </div>
    <div class="timer" id="timerDisplay">00:00</div>
    <button onclick="setTimer(10)">10 min</button>
    <button onclick="setTimer(15)">15 min</button>
    <button onclick="setTimer(20)">20 min</button>
    <button onclick="startTimer()">▶️ Iniciar</button>
    <button onclick="pauseTimer()">⏸️ Pausar</button>
    <h3>Ingredientes (gramajes exactos)</h3>
    <ul>${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
    <h3>Pasos</h3>
    ${r.steps.map((s,i) => `<div style="margin:8px 0;padding:10px;background:#222;border-radius:8px;"><strong>${i+1}.</strong> ${s}</div>`).join('')}
    <p style="margin-top:12px;"><em>${r.tip}</em></p>
  `;
  document.getElementById('modal').style.display = 'block';
}

function closeModal() {
  pauseTimer();
  document.getElementById('modal').style.display = 'none';
}

function setTimer(m) { timerSeconds = m*60; updateTimer(); }
function startTimer() {
  if (timerInterval) return;
  timerInterval = setInterval(() => {
    if (timerSeconds <= 0) { clearInterval(timerInterval); timerInterval=null; alert('⏰ ¡Listo!'); return; }
    timerSeconds--; updateTimer();
  }, 1000);
}
function pauseTimer() { clearInterval(timerInterval); timerInterval=null; }
function updateTimer() {
  const m = Math.floor(timerSeconds/60), s = timerSeconds%60;
  const el = document.getElementById('timerDisplay');
  if (el) el.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function generateAI() {
  const q = document.getElementById('ingredients').value.toLowerCase().trim();
  if (!q) return alert('Escribe algunos ingredientes primero');
  const words = q.split(/[, ]+/).filter(w => w.length > 2);
  const matches = recipes.filter(r => 
    r.ingredients.some(ing => words.some(w => ing.toLowerCase().includes(w)))
  );
  if (matches.length === 0) {
    alert('No encontré coincidencias exactas. Te muestro las más populares.');
    display(recipes.slice(0, 4));
  } else {
    display(matches);
  }
}

function renderTips() {
  document.getElementById('tips').innerHTML = tips.map(t => `<li>${t}</li>`).join('');
}

display();
renderTips();
window.onclick = e => { if (e.target.id === 'modal') closeModal(); };
</script>
</body>
</html>
