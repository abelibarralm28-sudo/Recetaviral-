<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abel Ibarra Chef</title>
<style>
:root { --primary:#ff0050; --secondary:#00f2ea; --bg:#0f0f0f; --card:#1a1a1a; --text:#fff; --muted:#aaa; --border:#333; }
[data-theme="light"] { --bg:#f8f9fa; --card:#fff; --text:#1a1a1a; --muted:#666; --border:#e0e0e0; }
* { box-sizing:border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); margin:0; padding:16px; max-width:920px; margin:0 auto; line-height:1.5; }
header { text-align:center; padding:24px 16px; background:linear-gradient(135deg,#ff0050,#00f2ea); border-radius:20px; margin-bottom:20px; color:#fff; }
.logo { width:80px; height:80px; border-radius:50%; object-fit:cover; margin-bottom:8px; border:3px solid #fff; }
h1 { margin:0 0 6px; font-size:1.8em; }
.card { background:var(--card); border-radius:16px; padding:18px; margin-bottom:16px; border:1px solid var(--border); }
input, textarea, button { width:100%; padding:12px; margin:6px 0; border:none; border-radius:10px; font-size:16px; }
input, textarea { background:var(--bg); color:var(--text); border:1px solid var(--border); }
button { background:var(--primary); color:#fff; font-weight:bold; cursor:pointer; }
.filters { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
.filter-btn { padding:8px 14px; background:var(--bg); border-radius:20px; cursor:pointer; border:2px solid transparent; font-size:14px; }
.filter-btn.active { border-color:var(--secondary); }
.recipe { background:var(--bg); border-radius:12px; padding:0; margin:10px 0; cursor:pointer; border:1px solid var(--border); overflow:hidden; }
.recipe img { width:100%; height:160px; object-fit:cover; display:block; }
.recipe-content { padding:14px; }
.recipe h3 { color:var(--secondary); margin:0 0 6px; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:1000; overflow:auto; }
.modal-content { background:var(--card); margin:16px auto; padding:20px; border-radius:16px; max-width:640px; position:relative; }
.modal img { width:100%; border-radius:12px; margin-bottom:12px; }
.close { position:absolute; top:12px; right:14px; font-size:28px; cursor:pointer; color:#fff; }
.timer { font-size:2em; font-weight:bold; color:var(--secondary); text-align:center; margin:12px 0; }
.macros { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
.macro { background:var(--bg); padding:6px 10px; border-radius:8px; }
.badge { display:inline-block; background:var(--card); padding:2px 8px; border-radius:10px; font-size:.8em; margin-right:4px; }
</style>
</head>
<body>
<header>
  <img src="images/logo.jpg" alt="Abel Ibarra Chef" class="logo">
  <h1>Abel Ibarra Chef</h1>
  <p>Nikkei • Mediterráneo • Virales</p>
</header>

<div class="card">
  <h2>Generador Inteligente</h2>
  <textarea id="ingredients" placeholder="Escribe lo que tienes: salmón, limón, ajo, brócoli, feta..." rows="3"></textarea>
  <button onclick="generateAI()">✨ Generar recetas</button>
  <div class="filters">
    <div class="filter-btn active" onclick="setFilter('all',this)">Todas</div>
    <div class="filter-btn" onclick="setFilter('nikkei',this)">Nikkei</div>
    <div class="filter-btn" onclick="setFilter('mediterraneo',this)">Mediterráneo</div>
    <div class="filter-btn" onclick="setFilter('viral',this)">Virales</div>
    <div class="filter-btn" onclick="setFilter('protein',this)">Alto proteína</div>
  </div>
</div>

<div id="recipes" class="card"></div>

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const recipes = [
  {id:1, name:"Pasta de Feta al Horno (Viral)", tip:"La receta que empezó el boom de TikTok.", img:"images/feta.jpg", ingredients:["200 g pasta","200 g queso feta","250 g tomates cherry","3 dientes de ajo","30 ml aceite de oliva","10 g albahaca"], steps:["Precalienta el horno a 200 °C.","Coloca el feta y los tomates en una bandeja.","Añade el ajo y el aceite.","Hornea 25-30 min.","Mezcla con la pasta y la albahaca."], tags:["viral","mediterraneo"], time:"35 min", protein:"medio", macros:{kcal:520,protein:18,carbs:55,fat:26}},
  {id:2, name:"Tiradito Nikkei de Salmón", tip:"Fresco, cítrico y elegante.", img:"images/tiradito.jpg", ingredients:["200 g salmón fresco","30 ml jugo de limón","15 ml salsa de soja","10 g jengibre","aji amarillo","cilantro"], steps:["Corta el salmón en láminas.","Mezcla limón, soja y jengibre.","Baña el salmón.","Deja reposar 5 minutos.","Sirve con cilantro."], tags:["nikkei","protein","fast"], time:"10 min", protein:"alto", macros:{kcal:280,protein:28,carbs:4,fat:16}},
  {id:3, name:"Ensalada Mediterránea de Quinoa", tip:"Fresca y completa.", img:"images/quinoa.jpg", ingredients:["100 g quinoa","150 g garbanzos","1 pepino","100 g tomates cherry","50 g feta","aceitunas","limón","aceite"], steps:["Cocina la quinoa.","Mezcla con las verduras y garbanzos.","Añade feta y aceitunas.","Aliña con limón y aceite."], tags:["mediterraneo","protein","healthy"], time:"20 min", protein:"alto", macros:{kcal:420,protein:18,carbs:48,fat:16}},
  {id:4, name:"Arroz Chaufa Nikkei", tip:"Fusión peruano-china-japonesa.", img:"", ingredients:["200 g arroz cocido","150 g pollo","2 huevos","30 ml salsa de soja","ajo","jengibre","cebollín"], steps:["Saltea ajo y jengibre.","Añade el pollo.","Incorpora el arroz y la soja.","Agrega los huevos y el cebollín."], tags:["nikkei","protein","fast"], time:"20 min", protein:"alto", macros:{kcal:480,protein:30,carbs:52,fat:14}},
  {id:5, name:"Pollo al Limón Mediterráneo", tip:"Jugoso y aromático.", img:"", ingredients:["400 g pechuga de pollo","1 limón","3 dientes de ajo","20 ml aceite de oliva","romero"], steps:["Marina el pollo.","Dora en sartén.","Cocina hasta dorado.","Sirve con el jugo."], tags:["mediterraneo","protein","easy"], time:"25 min", protein:"alto", macros:{kcal:380,protein:42,carbs:4,fat:20}}
];

let currentFilter = 'all';
let timerSeconds = 0;
let timerInterval = null;

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  display();
}

function display(list) {
  const arr = list || recipes.filter(r => currentFilter === 'all' || r.tags.includes(currentFilter));
  document.getElementById('recipes').innerHTML = '<h2>Recetas</h2>' + arr.map(r => `
    <div class="recipe" onclick="openRecipe(${r.id})">
      ${r.img ? `<img src="${r.img}" alt="${r.name}">` : ''}
      <div class="recipe-content">
        <h3>${r.name}</h3>
        <div>
          <span class="badge">⏱ ${r.time}</span>
          <span class="badge">💪 ${r.protein}</span>
          ${r.tags.includes('nikkei') ? '<span class="badge">Nikkei</span>' : ''}
          ${r.tags.includes('mediterraneo') ? '<span class="badge">Mediterráneo</span>' : ''}
        </div>
        <p>${r.tip}</p>
      </div>
    </div>
  `).join('');
}

function openRecipe(id) {
  const r = recipes.find(x => x.id === id);
  document.getElementById('modal-body').innerHTML = `
    ${r.img ? `<img src="${r.img}" alt="${r.name}">` : ''}
    <h2>${r.name}</h2>
    <p>⏱ ${r.time} • 💪 ${r.protein}</p>
    <div class="macros">
      <div class="macro">${r.macros.kcal} kcal</div>
      <div class="macro">P: ${r.macros.protein}g</div>
      <div class="macro">C: ${r.macros.carbs}g</div>
      <div class="macro">F: ${r.macros.fat}g</div>
    </div>
    <div class="timer" id="timerDisplay">00:00</div>
    <button onclick="setTimer(10)">10 min</button>
    <button onclick="setTimer(15)">15 min</button>
    <button onclick="startTimer()">▶️ Iniciar</button>
    <button onclick="pauseTimer()">⏸️ Pausar</button>
    <h3>Ingredientes</h3>
    <ul>${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
    <h3>Pasos</h3>
    ${r.steps.map((s,i) => `<div style="margin:8px 0;padding:10px;background:var(--bg);border-radius:8px;"><strong>${i+1}.</strong> ${s}</div>`).join('')}
  `;
  document.getElementById('modal').style.display = 'block';
}

function closeModal() {
  pauseTimer();
  document.getElementById('modal').style.display = 'none';
}

function setTimer(m) { timerSeconds = m*60; updateTimer(); }
function startTimer() {
  if (timerInterval) return;
  timerInterval = setInterval(() => {
    if (timerSeconds <= 0) { clearInterval(timerInterval); timerInterval=null; alert('⏰ ¡Listo!'); return; }
    timerSeconds--; updateTimer();
  }, 1000);
}
function pauseTimer() { clearInterval(timerInterval); timerInterval=null; }
function updateTimer() {
  const m = Math.floor(timerSeconds/60), s = timerSeconds%60;
  const el = document.getElementById('timerDisplay');
  if (el) el.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function generateAI() {
  const q = document.getElementById('ingredients').value.toLowerCase().trim();
  if (!q) return alert('Escribe algunos ingredientes');
  const words = q.split(/[, ]+/).filter(w => w.length > 2);
  const matches = recipes.filter(r => r.ingredients.some(ing => words.some(w => ing.toLowerCase().includes(w))));
  display(matches.length ? matches : recipes);
}

display();
window.onclick = e => { if (e.target.id === 'modal') closeModal(); };
</script>
</body>
</html>
