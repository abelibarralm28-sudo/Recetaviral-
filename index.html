<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abel Ibarra Chef</title>
<style>
:root { --primary:#ff0050; --secondary:#00f2ea; --bg:#0f0f0f; --card:#1a1a1a; --text:#fff; --border:#333; }
body { font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); margin:0; padding:16px; max-width:900px; margin:0 auto; line-height:1.5; }
header { text-align:center; padding:24px 16px; background:linear-gradient(135deg,#ff0050,#00f2ea); border-radius:20px; margin-bottom:20px; }
.logo { width:72px; height:72px; border-radius:50%; object-fit:cover; border:3px solid #fff; margin-bottom:8px; }
h1 { margin:0 0 4px; font-size:1.7em; }
.card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; border:1px solid var(--border); }
input, textarea, button { width:100%; padding:12px; margin:6px 0; border:none; border-radius:10px; font-size:16px; box-sizing:border-box; }
input, textarea { background:#2a2a2a; color:#fff; }
button { background:var(--primary); color:#fff; font-weight:bold; cursor:pointer; }
.filters { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0; }
.filter-btn { padding:7px 12px; background:#333; border-radius:20px; cursor:pointer; border:2px solid transparent; font-size:13px; }
.filter-btn.active { border-color:var(--secondary); }
.recipe { background:#222; border-radius:12px; margin:8px 0; cursor:pointer; padding:12px; position:relative; }
.recipe h3 { color:var(--secondary); margin:0 0 4px; font-size:1.05em; }
.badge { display:inline-block; background:#333; padding:2px 7px; border-radius:8px; font-size:.75em; margin-right:4px; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:1000; overflow:auto; }
.modal-content { background:var(--card); margin:12px auto; padding:18px; border-radius:16px; max-width:620px; position:relative; }
.close { position:absolute; top:10px; right:14px; font-size:26px; cursor:pointer; }
.timer { font-size:1.8em; font-weight:bold; color:var(--secondary); text-align:center; margin:10px 0; }
.macros { display:flex; gap:6px; flex-wrap:wrap; }
.macro { background:#222; padding:5px 9px; border-radius:8px; font-size:.85em; }
.servings { display:flex; gap:8px; align-items:center; margin:8px 0; }
.servings button { width:40px; }
.step { margin:8px 0; padding:10px; background:#222; border-radius:8px; }
.fav { position:absolute; top:10px; right:10px; font-size:20px; cursor:pointer; }
.week { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; }
.day { background:#222; border-radius:10px; padding:10px; text-align:center; }
.highlight { border-left:4px solid var(--secondary); }
</style>
</head>
<body>
<header>
  <img src="images/logo.jpg" alt="Abel Ibarra Chef" class="logo">
  <h1>Abel Ibarra Chef</h1>
  <p>100 recetas • Rotación diaria • Sugerencias inteligentes</p>
</header>

<div class="card">
  <h2>Generador de recetas</h2>
  <textarea id="ingredients" placeholder="Escribe lo que tienes en casa..." rows="2"></textarea>
  <button onclick="generate()">✨ Generar recetas</button>
  <button onclick="surpriseMe()">🎲 Sorpréndeme</button>
  <div class="filters">
    <div class="filter-btn active" onclick="setFilter('all',this)">Todas</div>
    <div class="filter-btn" onclick="setFilter('nikkei',this)">Nikkei</div>
    <div class="filter-btn" onclick="setFilter('otono',this)">Otoño</div>
    <div class="filter-btn" onclick="setFilter('mediterraneo',this)">Mediterráneo</div>
    <div class="filter-btn" onclick="showFavorites()">❤️ Favoritos</div>
    <div class="filter-btn" onclick="showPlanner()">📅 Planificador</div>
    <div class="filter-btn" onclick="showShopping()">🛒 Lista de compra</div>
  </div>
</div>

<div id="recipes" class="card"></div>
<div id="planner" class="card" style="display:none;"></div>
<div id="shoppingView" class="card" style="display:none;"></div>

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

let currentFilter = 'all';
let currentServings = {};
let shoppingList = JSON.parse(localStorage.getItem('shopping') || '[]');
let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
let weeklyPlan = JSON.parse(localStorage.getItem('weeklyPlan') || '{}');
let timerSeconds = 0, timerInterval = null;

function normalize(str) {
  return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function getDayOfYear() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const diff = now - start;
  return Math.floor(diff / (1000 * 60 * 60 * 24));
}

function getTimeBasedSuggestions() {
  const hour = new Date().getHours();
  if (hour < 11) return recipes.filter(r => (r.time && parseInt(r.time) <= 20) || r.name.toLowerCase().includes('desayuno') || r.name.toLowerCase().includes('crema')).slice(0, 8);
  if (hour < 16) return recipes.filter(r => !r.name.toLowerCase().includes('desayuno')).slice(0, 10);
  return recipes.filter(r => (r.time && parseInt(r.time) <= 30) || r.tags?.includes('nikkei') || r.tags?.includes('mediterraneo')).slice(0, 8);
}

function getDailyFeatured() {
  const day = getDayOfYear();
  const start = day % recipes.length;
  const featured = [];
  for (let i = 0; i < 6; i++) {
    featured.push(recipes[(start + i) % recipes.length]);
  }
  return featured;
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
  document.getElementById('planner').style.display = 'none';
  document.getElementById('shoppingView').style.display = 'none';
  document.getElementById('recipes').style.display = 'block';
  display();
}

function display(list) {
  let arr = list;
  if (!arr) {
    if (currentFilter === 'all') {
      const featured = getDailyFeatured();
      const suggestions = getTimeBasedSuggestions();
      arr = [...featured, ...suggestions.filter(r => !featured.includes(r))].slice(0, 20);
    } else {
      arr = recipes.filter(r => r.tags && r.tags.includes(currentFilter));
    }
  }
  const title = currentFilter === 'all' ? 'Recetas del día + sugerencias' : 'Recetas (' + arr.length + ')';
  document.getElementById('recipes').innerHTML = '<h2>' + title + '</h2>' + arr.map((r, idx) => `
    <div class="recipe ${idx < 6 && currentFilter === 'all' ? 'highlight' : ''}" onclick="openRecipe(${r.id})">
      <span class="fav" onclick="event.stopPropagation(); toggleFav(${r.id})">${favorites.includes(r.id) ? '❤️' : '🤍'}</span>
      <h3>${r.name}</h3>
      <span class="badge">${r.time || '20 min'}</span>
      <span class="badge">${r.protein || 'medio'}</span>
      ${r.tags && r.tags.includes('nikkei') ? '<span class="badge">Nikkei</span>' : ''}
      ${r.tags && r.tags.includes('otono') ? '<span class="badge">Otoño</span>' : ''}
      <p>${r.tip || ''}</p>
    </div>`).join('');
}

function openRecipe(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  if (!currentServings[id]) currentServings[id] = r.baseServings || 2;
  const base = r.baseServings || 2;
  const mult = currentServings[id] / base;
  document.getElementById('modal-body').innerHTML = `
    <h2>${r.name}</h2>
    <div class="macros">
      <div class="macro">${Math.round((r.macros?.kcal || 400) * mult)} kcal</div>
      <div class="macro">P: ${Math.round((r.macros?.protein || 20) * mult)}g</div>
      <div class="macro">C: ${Math.round((r.macros?.carbs || 30) * mult)}g</div>
      <div class="macro">F: ${Math.round((r.macros?.fat || 12) * mult)}g</div>
    </div>
    <div class="servings">
      <button onclick="changeServings(${id}, -1)">-</button>
      <span>${currentServings[id]} porciones</span>
      <button onclick="changeServings(${id}, 1)">+</button>
    </div>
    <button onclick="toggleFav(${id})">${favorites.includes(id) ? '❤️ Quitar de favoritos' : '🤍 Añadir a favoritos'}</button>
    <div class="timer" id="timerDisplay">00:00</div>
    <button onclick="setTimer(10)">10 min</button>
    <button onclick="setTimer(15)">15 min</button>
    <button onclick="startTimer()">▶️ Iniciar temporizador</button>
    <button onclick="pauseTimer()">⏸️ Pausar</button>
    <h3>Ingredientes (para ${currentServings[id]} porciones)</h3>
    <ul>${(r.ingredients || []).map(i => {
      const match = String(i).match(/^([\d.]+)\s*(.*)/);
      if (match) {
        const num = (parseFloat(match[1]) * mult).toFixed(match[1].includes('.') ? 1 : 0);
        return `<li>${num} ${match[2]}</li>`;
      }
      return `<li>${i}</li>`;
    }).join('')}</ul>
    <button onclick="addToShopping(${id})">➕ Añadir a la lista de compra</button>
    <h3>Pasos detallados</h3>
    ${(r.steps || []).map((s,i) => `<div class="step"><strong>Paso ${i+1}:</strong> ${s.replace(/^\d+\.\s*/, '')}</div>`).join('')}
    <p style="margin-top:12px;"><em>${r.tip || ''}</em></p>
  `;
  document.getElementById('modal').style.display = 'block';
}

function toggleFav(id) {
  if (favorites.includes(id)) favorites = favorites.filter(x => x !== id);
  else favorites.push(id);
  localStorage.setItem('favorites', JSON.stringify(favorites));
  display();
  if (document.getElementById('modal').style.display === 'block') openRecipe(id);
}

function showFavorites() {
  const favRecipes = recipes.filter(r => favorites.includes(r.id));
  document.getElementById('recipes').style.display = 'block';
  document.getElementById('planner').style.display = 'none';
  document.getElementById('shoppingView').style.display = 'none';
  display(favRecipes);
}

function showPlanner() {
  document.getElementById('recipes').style.display = 'none';
  document.getElementById('shoppingView').style.display = 'none';
  const days = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  document.getElementById('planner').style.display = 'block';
  document.getElementById('planner').innerHTML = '<h2>Planificador semanal</h2><div class="week">' + days.map(d => `
    <div class="day">
      <strong>${d}</strong>
      <select onchange="setPlan('${d}', this.value)">
        <option value="">— Elegir —</option>
        ${recipes.map(r => `<option value="${r.id}" ${weeklyPlan[d]==r.id?'selected':''}>${r.name}</option>`).join('')}
      </select>
    </div>`).join('') + '</div>';
}

function setPlan(day, id) {
  if (id) weeklyPlan[day] = parseInt(id);
  else delete weeklyPlan[day];
  localStorage.setItem('weeklyPlan', JSON.stringify(weeklyPlan));
}

function showShopping() {
  document.getElementById('recipes').style.display = 'none';
  document.getElementById('planner').style.display = 'none';
  document.getElementById('shoppingView').style.display = 'block';
  document.getElementById('shoppingView').innerHTML = '<h2>Lista de compra</h2>' + 
    (shoppingList.length ? shoppingList.map((item,i) => `<div style="margin:6px 0;"><input type="checkbox" onchange="removeShop(${i})"> ${item}</div>`).join('') : '<p>Tu lista está vacía. Añade ingredientes desde las recetas.</p>') +
    '<button onclick="clearShopping()">Vaciar lista</button>';
}

function removeShop(i) {
  shoppingList.splice(i, 1);
  localStorage.setItem('shopping', JSON.stringify(shoppingList));
  showShopping();
}

function clearShopping() {
  shoppingList = [];
  localStorage.setItem('shopping', JSON.stringify(shoppingList));
  showShopping();
}

function changeServings(id, delta) {
  currentServings[id] = Math.max(1, currentServings[id] + delta);
  openRecipe(id);
}

function addToShopping(id) {
  const r = recipes.find(x => x.id === id);
  const base = r.baseServings || 2;
  const mult = currentServings[id] / base;
  (r.ingredients || []).forEach(i => {
    const match = String(i).match(/^([\d.]+)\s*(.*)/);
    let item = i;
    if (match) {
      const num = (parseFloat(match[1]) * mult).toFixed(match[1].includes('.') ? 1 : 0);
      item = `${num} ${match[2]}`;
    }
    if (!shoppingList.includes(item)) shoppingList.push(item);
  });
  localStorage.setItem('shopping', JSON.stringify(shoppingList));
  alert('Añadido a la lista de compra');
}

function closeModal() { pauseTimer(); document.getElementById('modal').style.display = 'none'; }

function setTimer(m) { timerSeconds = m*60; updateTimer(); }
function startTimer() {
  if (timerInterval) return;
  timerInterval = setInterval(() => {
    if (timerSeconds <= 0) { clearInterval(timerInterval); timerInterval=null; alert('⏰ ¡Listo!'); return; }
    timerSeconds--; updateTimer();
  }, 1000);
}
function pauseTimer() { clearInterval(timerInterval); timerInterval=null; }
function updateTimer() {
  const m = Math.floor(timerSeconds/60), s = timerSeconds%60;
  const el = document.getElementById('timerDisplay');
  if (el) el.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function generate() {
  const q = document.getElementById('ingredients').value.trim();
  if (!q) return alert('Escribe algunos ingredientes');
  const words = normalize(q).split(/[, ]+/).filter(w => w.length > 2);
  const matches = recipes.filter(r => {
    const text = normalize((r.name || '') + ' ' + (r.ingredients || []).join(' ') + ' ' + (r.tip || ''));
    return words.some(w => text.includes(w));
  });
  setFilter('all');
  display(matches.length ? matches : recipes.slice(0, 10));
}

function surpriseMe() {
  const random = recipes[Math.floor(Math.random() * recipes.length)];
  openRecipe(random.id);
}

display();
window.onclick = e => { if (e.target.id === 'modal') closeModal(); };
</script>
</body>
</html>
