<title>RecetaViral - Generador de Recetas Rápidas Estilo TikTok</title>
<style>
:root {
  --primary: #ff0050;
  --secondary: #00f2ea;
  --bg: #0f0f0f;
  --card: #1a1a1a;
  --text: #ffffff;
  --muted: #aaaaaa;
  --border: #333;
}
[data-theme="light"] {
  --bg: #f5f5f7;
  --card: #ffffff;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --border: #e0e0e0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  padding: 16px;
  max-width: 1200px;
  margin: 0 auto;
  transition: background 0.3s, color 0.3s;
}
header {
  text-align: center;
  padding: 32px 16px;
  background: linear-gradient(135deg, #ff0050, #00f2ea);
  border-radius: 20px;
  margin-bottom: 24px;
  color: white;
  position: relative;
}
h1 { font-size: 2.2em; margin-bottom: 8px; }
.subtitle { font-size: 1.1em; opacity: 0.95; }
.top-controls {
  position: absolute;
  top: 12px;
  right: 12px;
  display: flex;
  gap: 8px;
}
.top-btn {
  background: rgba(0,0,0,0.35);
  border: none;
  color: white;
  border-radius: 20px;
  padding: 6px 12px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
}
.container { display: grid; grid-template-columns: 1fr 2fr; gap: 24px; }
@media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
.card {
  background: var(--card);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.15);
  border: 1px solid var(--border);
}
h2 { margin-bottom: 16px; color: var(--secondary); font-size: 1.3em; }
input, select, button, textarea {
  width: 100%;
  padding: 12px 14px;
  margin: 6px 0;
  border: none;
  border-radius: 10px;
  font-size: 16px;
}
input, select, textarea { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
button {
  background: var(--primary);
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.1s;
}
button:hover { transform: scale(1.02); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.filter-btn {
  padding: 8px 14px;
  background: var(--bg);
  border-radius: 20px;
  cursor: pointer;
  border: 2px solid transparent;
  font-size: 14px;
}
.filter-btn.active { border-color: var(--secondary); background: var(--card); }
.recipe-grid { display: grid; gap: 16px; }
.recipe-card {
  background: var(--bg);
  border-radius: 12px;
  padding: 16px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  border: 1px solid var(--border);
  position: relative;
}
.recipe-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
.recipe-card h3 { color: var(--secondary); margin-bottom: 6px; font-size: 1.1em; }
.fav-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  width: auto;
  padding: 0;
}
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.tag { background: var(--card); padding: 3px 8px; border-radius: 10px; font-size: 0.8em; border: 1px solid var(--border); }
.modal {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.75);
  z-index: 1000;
  overflow-y: auto;
}
.modal-content {
  background: var(--card);
  margin: 20px auto;
  padding: 24px;
  border-radius: 16px;
  max-width: 700px;
  position: relative;
  color: var(--text);
}
.close { position: absolute; top: 12px; right: 16px; font-size: 28px; cursor: pointer; }
.step { margin: 10px 0; padding: 12px; background: var(--bg); border-radius: 8px; }
.macros { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0; }
.macro { background: var(--bg); padding: 8px 12px; border-radius: 8px; font-size: 0.9em; }
.servings-control { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
.servings-control button { width: 40px; padding: 6px; }
.shopping-list { list-style: none; }
.shopping-list li { padding: 8px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
footer { text-align: center; margin-top: 40px; color: var(--muted); padding: 16px; font-size: 0.9em; }
.timer-box {
  background: var(--bg);
  border-radius: 12px;
  padding: 16px;
  margin: 16px 0;
  text-align: center;
  border: 2px solid var(--secondary);
}
.timer-display {
  font-size: 2.5em;
  font-weight: bold;
  color: var(--secondary);
  margin: 8px 0;
}
.timer-controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.timer-controls button { width: auto; padding: 8px 16px; margin: 0; }
.timer-presets { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
.timer-presets button { width: auto; padding: 6px 12px; font-size: 13px; background: var(--card); color: var(--text); border: 1px solid var(--border); }
</head>

    <button id="randomBtn" onclick="showRandom()">🎲 Sorpresa</button>

  </div>

  <div class="card">
    <h2 id="recipesTitle">Recetas</h2>
    <div id="recipes" class="recipe-grid"></div>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

<div class="card" style="margin-top:24px;">

  <ul id="shopping" class="shopping-list"></ul>
  <button id="clearBtn" onclick="clearShopping()">Limpiar lista</button>

<footer>

</footer>

function t(key) { return i18n[lang][key] || key; }

function updateUI() {
  document.getElementById('appTitle').textContent = t('title');
  document.getElementById('appSubtitle').textContent = t('subtitle');
  document.getElementById('appTagline').textContent = t('tagline');
  document.getElementById('fridgeTitle').textContent = t('fridge');
  document.getElementById('ingredients').placeholder = t('placeholder');
  document.getElementById('genBtn').textContent = t('genBtn');
  document.getElementById('filtersTitle').textContent = t('filters');
  document.getElementById('randomBtn').textContent = t('random');
  document.getElementById('planBtn').textContent = t('plan');
  document.getElementById('recipesTitle').textContent = t('recipes');
  document.getElementById('shopTitle').textContent = t('shop');
  document.getElementById('clearBtn').textContent = t('clear');
  document.getElementById('searchInput').placeholder = lang === 'es' ? 'Buscar por nombre...' : 'Search by name...';
  document.getElementById('footerText').textContent = lang === 'es' 
    ? "Abel Ibarra Chef • Recetas precisas • Bilingüe • Favoritos en tu dispositivo"
    : "Abel Ibarra Chef • Precise recipes • Bilingual • Favorites on your device";

  const filterKeys = ['all','easy','protein','fast','viral','breakfast','favorites'];
  document.querySelectorAll('.filter-btn').forEach((btn, i) => {
    if (filterKeys[i]) btn.textContent = t(filterKeys[i]);
  });
  displayRecipes();
  updateShopping();
}

function toggleLang() {
  lang = lang === 'es' ? 'en' : 'es';
  localStorage.setItem('lang', lang);
  updateUI();
}

function toggleTheme() {
  theme = theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
  document.querySelector('.top-btn').textContent = theme === 'dark' ? '🌙' : '☀️';
}

function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  displayRecipes();
}

function searchRecipes() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  if (!q) return displayRecipes();
  const filtered = recipes.filter(r => r.name[lang].toLowerCase().includes(q) || r.tip[lang].toLowerCase().includes(q));
  displayRecipes(filtered);
}

function displayRecipes(filtered = null) {
  const container = document.getElementById('recipes');
  let list = filtered || recipes;
  if (currentFilter === 'favorites') {
    list = recipes.filter(r => favorites.includes(r.id));
  } else if (currentFilter !== 'all' && !filtered) {
    list = recipes.filter(r => r.tags.includes(currentFilter));
  }
  if (list.length === 0) {
    container.innerHTML = `<p style="text-align:center;color:var(--muted);padding:20px;">${lang==='es'?'No hay recetas en esta categoría':'No recipes in this category'}</p>`;
    return;
  }
  container.innerHTML = list.map(r => `
    <div class="recipe-card" onclick="showRecipe(${r.id})">
      <button class="fav-btn" onclick="event.stopPropagation(); toggleFav(${r.id})">${favorites.includes(r.id)?'❤️':'🤍'}</button>
      <h3>${r.name[lang]}</h3>
      <div class="tags">
        <span class="tag">⏱ ${r.time}</span>
        <span class="tag">💪 ${r.protein[lang]}</span>
        ${r.tags.includes('viral') ? '<span class="tag">🔥 Viral</span>' : ''}
      </div>
      <p>${r.tip[lang]}</p>
    </div>
  `).join('');
}

function showRecipe(id) {
  const r = recipes.find(x => x.id === id);
  currentServings = r.servings || 2;
  renderModal(r);
  document.getElementById('modal').style.display = 'block';
}

function renderModal(r) {
  const factor = currentServings / (r.servings || 2);
  const ings = r.ingredients[lang].map(i => {
    const match = i.match(/^(\d+(\.\d+)?)\s*(g|ml|cdas?|tsp|tbsp)?/i);
    if (match) {
      const num = parseFloat(match[1]) * factor;
      return i.replace(match[0], Math.round(num*10)/10 + (match[3]||''));
    }
    return i;
  });
  document.getElementById('modal-body').innerHTML = `
    <h2>${r.name[lang]}</h2>
    <p><strong>${t('time')}:</strong> ${r.time} | <strong>${t('proteinLabel')}:</strong> ${r.protein[lang]}</p>
    <div class="tags">${r.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
    <div class="servings-control">
      <span>${t('servings')}:</span>
      <button onclick="changeServings(${r.id}, -1)">-</button>
      <strong>${currentServings}</strong>
      <button onclick="changeServings(${r.id}, 1)">+</button>
    </div>
    <div class="macros">
      <div class="macro">${Math.round(r.macros.kcal * factor)} kcal</div>
      <div class="macro">P: ${Math.round(r.macros.protein * factor)}g</div>
      <div class="macro">C: ${Math.round(r.macros.carbs * factor)}g</div>
      <div class="macro">F: ${Math.round(r.macros.fat * factor)}g</div>
    </div>
    <p style="font-size:0.85em;color:var(--muted);">${t('macros')}</p>
    
    <div class="timer-box">
      <h3>⏱️ ${lang === 'es' ? 'Temporizador de cocina' : 'Cooking timer'}</h3>
      <div class="timer-display" id="timerDisplay">00:00</div>
      <div class="timer-presets">
        <button onclick="setTimer(5)">5 min</button>
        <button onclick="setTimer(10)">10 min</button>
        <button onclick="setTimer(15)">15 min</button>
        <button onclick="setTimer(20)">20 min</button>
        <button onclick="setTimer(30)">30 min</button>
      </div>
      <div class="timer-controls">
        <button onclick="startTimer()">▶️ ${lang === 'es' ? 'Iniciar' : 'Start'}</button>
        <button onclick="pauseTimer()">⏸️ ${lang === 'es' ? 'Pausar' : 'Pause'}</button>
        <button onclick="resetTimer()">🔄 ${lang === 'es' ? 'Reiniciar' : 'Reset'}</button>
      </div>
    </div>

    <h3>${t('ingredients')}</h3>
    <ul>${ings.map(i => `<li>${i}</li>`).join('')}</ul>
    <button onclick="addToShopping(${r.id})">${t('addShop')}</button>
    <h3>${t('steps')}</h3>
    ${r.steps[lang].map((s, i) => `<div class="step"><strong>${i+1}.</strong> ${s}</div>`).join('')}
    <p style="margin-top:15px;"><em>${r.tip[lang]}</em></p>
  `;
}

function changeServings(id, delta) {
  currentServings = Math.max(1, currentServings + delta);
  const r = recipes.find(x => x.id === id);
  renderModal(r);
}

let timerInterval = null;
let timerSeconds = 0;
let timerRunning = false;

function setTimer(minutes) {
  timerSeconds = minutes * 60;
  updateTimerDisplay();
  if (timerRunning) pauseTimer();
}

function startTimer() {
  if (timerSeconds <= 0) {
    alert(lang === 'es' ? 'Selecciona un tiempo primero' : 'Select a time first');
    return;
  }
  if (timerRunning) return;
  timerRunning = true;
  timerInterval = setInterval(() => {
    if (timerSeconds <= 0) {
      clearInterval(timerInterval);
      timerRunning = false;
      alert(lang === 'es' ? '⏰ ¡Tiempo terminado!' : '⏰ Time is up!');
      // Optional vibration if supported
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      return;
    }
    timerSeconds--;
    updateTimerDisplay();
  }, 1000);
}

function pauseTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
}

function resetTimer() {
  pauseTimer();
  timerSeconds = 0;
  updateTimerDisplay();
}

function updateTimerDisplay() {
  const m = Math.floor(timerSeconds / 60);
  const s = timerSeconds % 60;
  const display = document.getElementById('timerDisplay');
  if (display) {
    display.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
}

function closeModal() {
  pauseTimer();
  document.getElementById('modal').style.display = 'none';
}

function toggleFav(id) {
  if (favorites.includes(id)) {
    favorites = favorites.filter(f => f !== id);
    alert(t('favRemoved'));
  } else {
    favorites.push(id);
    alert(t('favAdded'));
  }
  localStorage.setItem('favorites', JSON.stringify(favorites));
  displayRecipes();
}

function generateFromIngredients() {
  const input = document.getElementById('ingredients').value.toLowerCase();
  if (!input.trim()) { alert(t('writeIng')); return; }
  const words = input.split(/[, ]+/).filter(w => w.length > 2);
  const matches = recipes.filter(r => 
    r.ingredients[lang].some(ing => words.some(w => ing.toLowerCase().includes(w)))
  );
  displayRecipes(matches.length ? matches : recipes.slice(0, 4));
  if (matches.length === 0) alert(t('noMatch'));
}

function showRandom() {
  const r = recipes[Math.floor(Math.random() * recipes.length)];
  showRecipe(r.id);
}

function generateMealPlan() {
  const days = lang === 'es' ? ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"] : ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
  const shuffled = [...recipes].sort(() => 0.5 - Math.random());
  let html = `<h2>${t('planTitle')}</h2>`;
  days.forEach((day, i) => {
    const r = shuffled[i % shuffled.length];
    html += `<div class="step"><strong>${day}:</strong> ${r.name[lang]} <button onclick="addToShopping(${r.id})" style="width:auto;padding:6px 10px;margin-left:8px;">+ Lista</button></div>`;
  });
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal').style.display = 'block';
}

function addToShopping(id) {
  const r = recipes.find(x => x.id === id);
  r.ingredients[lang].forEach(i => shoppingItems.add(i));
  localStorage.setItem('shopping', JSON.stringify([...shoppingItems]));
  updateShopping();
  alert(t('added'));
}

function updateShopping() {
  const ul = document.getElementById('shopping');
  ul.innerHTML = [...shoppingItems].map(i => `<li>🛒 ${i} <button onclick="removeFromShopping('${i.replace(/'/g,"\\'")}')" style="width:auto;padding:4px 8px;font-size:12px;">✕</button></li>`).join('') || `<li>${t('empty')}</li>`;
}

function removeFromShopping(item) {
  shoppingItems.delete(item);
  localStorage.setItem('shopping', JSON.stringify([...shoppingItems]));
  updateShopping();
}

function clearShopping() {
  shoppingItems.clear();
  localStorage.setItem('shopping', '[]');
  updateShopping();
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').style.display = 'block';
});

function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      document.getElementById('installBanner').style.display = 'none';
    });
  }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

updateUI();
updateShopping();

window.onclick = function(event) {
  if (event.target == document.getElementById('modal')) closeModal();
};
</script>
