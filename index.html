<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abel Ibarra Chef</title>
<style>
:root { --primary:#ff0050; --secondary:#00f2ea; --bg:#0f0f0f; --card:#1a1a1a; --text:#fff; --border:#333; }
body { font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); margin:0; padding:16px; max-width:900px; margin:0 auto; line-height:1.5; }
header { text-align:center; padding:24px 16px; background:linear-gradient(135deg,#ff0050,#00f2ea); border-radius:20px; margin-bottom:20px; }
.logo { width:72px; height:72px; border-radius:50%; object-fit:cover; border:3px solid #fff; margin-bottom:8px; }
h1 { margin:0 0 4px; font-size:1.7em; }
.card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; border:1px solid var(--border); }
input, textarea, button { width:100%; padding:12px; margin:6px 0; border:none; border-radius:10px; font-size:16px; box-sizing:border-box; }
input, textarea { background:#2a2a2a; color:#fff; }
button { background:var(--primary); color:#fff; font-weight:bold; cursor:pointer; }
.filters { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0; }
.filter-btn { padding:7px 12px; background:#333; border-radius:20px; cursor:pointer; border:2px solid transparent; font-size:13px; }
.filter-btn.active { border-color:var(--secondary); }
.recipe { background:#222; border-radius:12px; margin:8px 0; cursor:pointer; padding:12px; position:relative; }
.recipe h3 { color:var(--secondary); margin:0 0 4px; font-size:1.05em; }
.badge { display:inline-block; background:#333; padding:2px 7px; border-radius:8px; font-size:.75em; margin-right:4px; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:1000; overflow:auto; }
.modal-content { background:var(--card); margin:12px auto; padding:18px; border-radius:16px; max-width:620px; position:relative; }
.close { position:absolute; top:10px; right:14px; font-size:26px; cursor:pointer; }
.timer { font-size:1.8em; font-weight:bold; color:var(--secondary); text-align:center; margin:10px 0; }
.macros { display:flex; gap:6px; flex-wrap:wrap; }
.macro { background:#222; padding:5px 9px; border-radius:8px; font-size:.85em; }
.servings { display:flex; gap:8px; align-items:center; margin:8px 0; }
.servings button { width:40px; }
.step { margin:8px 0; padding:10px; background:#222; border-radius:8px; }
.fav { position:absolute; top:10px; right:10px; font-size:20px; cursor:pointer; }
.tech { background:#1e1e1e; padding:10px; border-radius:8px; margin:8px 0; font-size:.9em; }
</style>
</head>
<body>
<header>
  <img src="images/logo.jpg" alt="Abel Ibarra Chef" class="logo">
  <h1>Abel Ibarra Chef</h1>
  <p>Fichas técnicas • Costes • Menús • 100 recetas</p>
</header>

<div class="card">
  <h2>Generador de recetas</h2>
  <textarea id="ingredients" placeholder="Escribe lo que tienes en casa..." rows="2"></textarea>
  <button onclick="generate()">✨ Generar recetas</button>
  <button onclick="surpriseMe()">🎲 Sorpréndeme</button>
  <div class="filters">
    <div class="filter-btn active" onclick="setFilter('all',this)">Todas</div>
    <div class="filter-btn" onclick="setFilter('nikkei',this)">Nikkei</div>
    <div class="filter-btn" onclick="setFilter('otono',this)">Otoño</div>
    <div class="filter-btn" onclick="setFilter('mediterraneo',this)">Mediterráneo</div>
    <div class="filter-btn" onclick="showFavorites()">❤️ Favoritos</div>
    <div class="filter-btn" onclick="showMenus()">🍽️ Menús</div>
  </div>
</div>

<div id="recipes" class="card"></div>
<div id="menus" class="card" style="display:none;"></div>

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

const menus = [
  {name: "Menú Nikkei Ligero", items: ["Tiradito Nikkei de Salmón", "Ceviche Nikkei de Pescado Blanco"], note: "Acidez equilibrada y producto fresco."},
  {name: "Menú Otoño", items: ["Crema de Calabaza", "Lomo Saltado Nikkei"], note: "Temporada y profundidad de sabor."},
  {name: "Menú Mediterráneo", items: ["Ensalada de Quinoa", "Pasta con Feta"], note: "Fresco y fácil de ejecutar."}
];

let currentFilter = 'all';
let currentServings = {};
let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
let timerSeconds = 0, timerInterval = null;

function normalize(str) {
  return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
  document.getElementById('menus').style.display = 'none';
  document.getElementById('recipes').style.display = 'block';
  display();
}

function display(list) {
  const arr = list || recipes.filter(r => currentFilter === 'all' || (r.tags && r.tags.includes(currentFilter)));
  document.getElementById('recipes').innerHTML = '<h2>Recetas (' + arr.length + ')</h2>' + arr.map(r => `
    <div class="recipe" onclick="openRecipe(${r.id})">
      <span class="fav" onclick="event.stopPropagation(); toggleFav(${r.id})">${favorites.includes(r.id) ? '❤️' : '🤍'}</span>
      <h3>${r.name}</h3>
      <span class="badge">${r.time || '20 min'}</span>
      <span class="badge">${r.cost || 'medio'}</span>
      <span class="badge">${r.protein || 'medio'}</span>
    </div>`).join('');
}

function openRecipe(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  if (!currentServings[id]) currentServings[id] = r.baseServings || 2;
  const base = r.baseServings || 2;
  const mult = currentServings[id] / base;
  document.getElementById('modal-body').innerHTML = `
    <h2>${r.name}</h2>
    <div class="macros">
      <div class="macro">${Math.round((r.macros?.kcal || 400) * mult)} kcal</div>
      <div class="macro">P: ${Math.round((r.macros?.protein || 20) * mult)}g</div>
      <div class="macro">C: ${Math.round((r.macros?.carbs || 30) * mult)}g</div>
      <div class="macro">F: ${Math.round((r.macros?.fat || 12) * mult)}g</div>
    </div>
    <div class="servings">
      <button onclick="changeServings(${id}, -1)">-</button>
      <span>${currentServings[id]} porciones</span>
      <button onclick="changeServings(${id}, 1)">+</button>
    </div>
    <div class="tech">
      <strong>Ficha técnica</strong><br>
      Rendimiento: ${r.yield}<br>
      Coste orientativo: ${r.cost}<br>
      Punto crítico: ${r.critical}<br>
      Conservación: ${r.conservation}<br>
      Mise en place: ${r.mise}
    </div>
    <h3>Ingredientes (para ${currentServings[id]} porciones)</h3>
    <ul>${(r.ingredients || []).map(i => {
      const match = String(i).match(/^([\d.]+)\s*(.*)/);
      if (match) {
        const num = (parseFloat(match[1]) * mult).toFixed(match[1].includes('.') ? 1 : 0);
        return `<li>${num} ${match[2]}</li>`;
      }
      return `<li>${i}</li>`;
    }).join('')}</ul>
    <h3>Pasos</h3>
    ${(r.steps || []).map((s,i) => `<div class="step"><strong>Paso ${i+1}:</strong> ${s.replace(/^\d+\.\s*/, '')}</div>`).join('')}
  `;
  document.getElementById('modal').style.display = 'block';
}

function showMenus() {
  document.getElementById('recipes').style.display = 'none';
  document.getElementById('menus').style.display = 'block';
  document.getElementById('menus').innerHTML = '<h2>Menús sugeridos</h2>' + menus.map(m => `
    <div class="card">
      <h3>${m.name}</h3>
      <p>${m.items.join(' + ')}</p>
      <p><em>${m.note}</em></p>
    </div>`).join('');
}

function toggleFav(id) {
  if (favorites.includes(id)) favorites = favorites.filter(x => x !== id);
  else favorites.push(id);
  localStorage.setItem('favorites', JSON.stringify(favorites));
  display();
}

function changeServings(id, delta) {
  currentServings[id] = Math.max(1, currentServings[id] + delta);
  openRecipe(id);
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }

function generate() {
  const q = document.getElementById('ingredients').value.trim();
  if (!q) return alert('Escribe algunos ingredientes');
  const words = normalize(q).split(/[, ]+/).filter(w => w.length > 2);
  const matches = recipes.filter(r => {
    const text = normalize((r.name || '') + ' ' + (r.ingredients || []).join(' '));
    return words.some(w => text.includes(w));
  });
  setFilter('all');
  display(matches.length ? matches : recipes.slice(0, 10));
}

function surpriseMe() {
  const random = recipes[Math.floor(Math.random() * recipes.length)];
  openRecipe(random.id);
}

display();
window.onclick = e => { if (e.target.id === 'modal') closeModal(); };
</script>
